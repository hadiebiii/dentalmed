<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="کاتالوگ واژگان تخصصی دندان‌پزشکی — شناسنامه هر واژه با جملات مستند از رفرنس‌ها و تحلیل آزمون دستیاری">
<meta name="theme-color" content="#0f6f6a">
<title>کاتالوگ واژگان دندان‌پزشکی</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">

<style>
:root{
  color-scheme: light;
  --fa: "Vazirmatn", "IRANSansX", "Segoe UI", Tahoma, sans-serif;
  --en: "Charter", "Iowan Old Style", Cambria, Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", "Fira Code", "SF Mono", ui-monospace, Menlo, monospace;

  --canvas:#f6f4ee;
  --paper:#fffdf9;
  --paper-2:#faf8f3;
  --ink:#2f333c;
  --ink-soft:#4d5361;
  --muted:#7d8494;
  --line:#e6e1d6;
  --line-2:#efebe2;

  --teal:#0f6f6a;      --teal-soft:#e6f4f2;
  --indigo:#4a4fa8;    --indigo-soft:#ececfa;
  --amber:#9a6410;     --amber-soft:#fdf3df;
  --rose:#a8385a;      --rose-soft:#fbecf1;
  --sky:#186a95;       --sky-soft:#e7f2f9;
  --moss:#4a7a33;      --moss-soft:#eef5e7;

  --r-lg:20px; --r-md:14px; --r-sm:9px;
  --shadow:0 14px 40px rgba(47,51,60,.09);
  --shadow-sm:0 4px 14px rgba(47,51,60,.06);
  --head-h:60px;
  --page:1080px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--ink); font-family:var(--fa);
  line-height:1.85; font-size:15px;
  background:
    radial-gradient(circle at 6% -6%, rgba(15,111,106,.07), transparent 26rem),
    radial-gradient(circle at 96% 2%, rgba(74,79,168,.06), transparent 26rem),
    var(--canvas);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
::selection{background:var(--teal-soft);color:var(--teal)}
code{font-family:var(--mono);font-size:.9em;background:var(--paper-2);
  border:1px solid var(--line-2);border-radius:5px;padding:1px 5px}

/* ---------- header ---------- */
.hdr{
  position:sticky;top:0;z-index:60;height:var(--head-h);
  background:rgba(255,253,249,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.hdr-in{max-width:var(--page);margin:0 auto;height:100%;padding:0 16px;
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:11px;flex:none;
  background:linear-gradient(145deg,var(--teal),#14857e);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:15px;
  box-shadow:0 4px 12px rgba(15,111,106,.28)}
.brand h1{margin:0;font-size:14.5px;font-weight:800;line-height:1.3;white-space:nowrap}
.brand p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.3;white-space:nowrap}
.hdr-sp{flex:1}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);display:grid;place-items:center;color:var(--ink-soft);
  transition:.15s;flex:none}
.ib:hover{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.pill{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);font-size:12.5px;font-weight:600;color:var(--ink-soft);
  display:inline-flex;align-items:center;gap:6px;transition:.15s}
.pill:hover{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.pill svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.pill.on{background:var(--teal);border-color:var(--teal);color:#fff}

/* ---------- search ---------- */
.search-wrap{position:relative;flex:1;max-width:300px}
.search-wrap input{
  width:100%;height:34px;padding:0 34px 0 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--paper);font-size:13px}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap .si{position:absolute;inset-inline-end:11px;top:9px;width:16px;height:16px;
  stroke:var(--muted);fill:none;stroke-width:1.9;pointer-events:none}
.results{
  position:absolute;top:40px;inset-inline-start:0;inset-inline-end:0;z-index:70;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow);max-height:min(60vh,420px);overflow:auto;padding:5px}
.results button{display:block;width:100%;text-align:start;padding:7px 10px;
  border-radius:8px;font-size:13px;line-height:1.5}
.results button:hover,.results button[aria-selected=true]{background:var(--teal-soft)}
.results b{font-family:var(--en);font-weight:700;color:var(--teal)}
.results span{color:var(--muted);font-size:11.5px}
.results .none{padding:12px;color:var(--muted);font-size:13px;text-align:center}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(47,51,60,.4);
  backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
/* Anchored to the inline-start edge, so it slides out toward the page edge:
   left in LTR, right in RTL. translateX is physical, hence the dir override. */
.drawer{position:fixed;z-index:90;top:0;bottom:0;inset-inline-start:0;width:min(310px,86vw);
  background:var(--paper);border-inline-end:1px solid var(--line);
  transform:translateX(-100%);transition:transform .24s ease;display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(100%)}
.drawer.on,[dir=rtl] .drawer.on{transform:none}
.drawer-top{padding:14px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.drawer-top strong{font-size:14px}
.drawer-top span{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.drawer-list{list-style:none;margin:0;padding:8px;overflow:auto;flex:1}
.drawer-list button{width:100%;text-align:start;padding:8px 11px;border-radius:9px;
  font-size:13px;display:flex;align-items:center;gap:9px;color:var(--ink-soft)}
.drawer-list button:hover{background:var(--paper-2)}
.drawer-list button.on{background:var(--teal-soft);color:var(--teal);font-weight:700}
.dnum{font-family:var(--mono);font-size:11px;color:var(--muted);
  background:var(--paper-2);border:1px solid var(--line-2);border-radius:6px;
  padding:1px 6px;flex:none}
.drawer-list button.on .dnum{background:#fff;border-color:var(--teal);color:var(--teal)}

/* ---------- layout ---------- */
.page{max-width:var(--page);margin:0 auto;padding:18px 16px 70px}
.status{padding:10px 14px;border-radius:var(--r-md);background:var(--sky-soft);
  color:var(--sky);font-size:13px;margin-bottom:14px}
.status.err{background:var(--rose-soft);color:var(--rose)}

.wordbar{list-style:none;display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px;padding:0}
.wordbar button{padding:6px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--paper);font-family:var(--en);font-size:13.5px;font-weight:600;
  color:var(--ink-soft);transition:.15s}
.wordbar button:hover{border-color:var(--teal);color:var(--teal)}
.wordbar button.on{background:var(--teal);border-color:var(--teal);color:#fff;
  box-shadow:0 4px 12px rgba(15,111,106,.24)}

/* ---------- word poster ---------- */
.poster{animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.banner{position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:18px 20px;margin-bottom:12px;
  box-shadow:var(--shadow-sm);overflow:hidden}
.banner::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:5px;
  background:linear-gradient(180deg,var(--teal),var(--indigo))}
.banner-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px}
.banner h2{margin:0;font-family:var(--en);font-size:30px;font-weight:700;
  letter-spacing:.2px;line-height:1.25;color:var(--ink);direction:ltr}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:7px;
  background:var(--teal-soft);color:var(--teal);border:1px solid rgba(15,111,106,.18)}
.tag.i{background:var(--indigo-soft);color:var(--indigo);border-color:rgba(74,79,168,.18)}
.tag.a{background:var(--amber-soft);color:var(--amber);border-color:rgba(154,100,16,.18)}
.banner-act{margin-inline-start:auto;display:flex;gap:7px}

/* section cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.card-h{display:flex;align-items:center;gap:9px;padding-bottom:9px;margin-bottom:12px;
  border-bottom:1px solid var(--line-2)}
.card-h .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.card-h .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.card-h h3{margin:0;font-size:14.5px;font-weight:800}
.card-h .hint{margin-inline-start:auto;font-size:11px;color:var(--muted);font-weight:400}
.t-teal .ic{background:var(--teal-soft);color:var(--teal)}
.t-indigo .ic{background:var(--indigo-soft);color:var(--indigo)}
.t-sky .ic{background:var(--sky-soft);color:var(--sky)}
.t-moss .ic{background:var(--moss-soft);color:var(--moss)}
.t-amber .ic{background:var(--amber-soft);color:var(--amber)}
.t-rose .ic{background:var(--rose-soft);color:var(--rose)}

.lbl{font-size:11.5px;font-weight:800;color:var(--muted);margin:0 0 6px;letter-spacing:.2px}
.blk+.blk{margin-top:13px}
.para{margin:0;font-size:13.8px;line-height:1.95;color:var(--ink-soft)}
.panel{background:var(--paper-2);border:1px solid var(--line-2);
  border-radius:var(--r-md);padding:11px 13px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:3px 11px;border-radius:8px;
  background:var(--teal-soft);color:var(--teal);border:1px solid rgba(15,111,106,.16)}
.chip.en{font-family:var(--en);direction:ltr}
.chip.g{background:var(--moss-soft);color:var(--moss);border-color:rgba(74,122,51,.18)}
.chip.r{background:var(--rose-soft);color:var(--rose);border-color:rgba(168,56,90,.18)}

.bul{margin:0;padding-inline-start:18px;font-size:13.6px;line-height:1.9;color:var(--ink-soft)}
.bul li{margin-bottom:4px}
.bul li::marker{color:var(--teal)}

.en-line{font-family:var(--en);direction:ltr;text-align:left;font-size:14.5px;
  line-height:1.75;color:var(--ink);background:#fff;border:1px solid var(--line-2);
  border-radius:var(--r-sm);padding:9px 12px;margin:0}
.def-line{font-family:var(--mono);direction:ltr;text-align:left;font-size:12.8px;
  font-weight:600;background:#fff;border:1px solid var(--line-2);
  border-radius:var(--r-sm);padding:8px 11px;color:var(--ink);margin:0}

mark.hl{border-radius:5px;padding:.05em .3em;font-weight:700}
mark.hl-emerald{background:#d0eddf;color:#14614a}
mark.hl-amber{background:#fbecc2;color:#8a5a08}
mark.hl-rose{background:#fad9e3;color:#98304f}
mark.hl-sky{background:#d7e9f7;color:#155f85}

/* sentences */
.ref-box{border:1px solid rgba(74,79,168,.22);background:var(--indigo-soft);
  border-radius:var(--r-md);padding:12px 13px}
.ref-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.ref-top .badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:7px;
  background:#fff;color:var(--indigo);border:1px solid rgba(74,79,168,.25)}
.ref-top .src{margin-inline-start:auto;font-size:11.5px;color:var(--indigo)}
.ref-box .note{margin:9px 0 0;font-size:13.4px;line-height:1.9;color:var(--ink-soft)}

.slist{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.sitem{display:flex;gap:10px;background:var(--paper-2);border:1px solid var(--line-2);
  border-radius:var(--r-md);padding:11px 12px}
.snum{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--teal);
  background:#fff;border:1px solid var(--line-2);border-radius:7px;
  width:24px;height:24px;display:grid;place-items:center;flex:none;margin-top:2px}
.sbody{flex:1;min-width:0}
.sbody .note{margin:7px 0 0;font-size:13.2px;line-height:1.9;color:var(--ink-soft)}

/* look-alikes */
.lgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.lcard{background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r-md);
  padding:10px 12px}
.lcard b{font-family:var(--en);direction:ltr;display:block;font-size:14px;
  color:var(--amber);margin-bottom:2px}
.lcard i{font-style:normal;font-size:11px;color:var(--muted)}
.lcard p{margin:3px 0 0;font-size:12.8px;color:var(--ink-soft);line-height:1.75}

/* exam */
.axis{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.axis .blk{margin:0}
.strat{background:var(--amber-soft);border:1px solid rgba(154,100,16,.2);
  border-radius:var(--r-md);padding:11px 13px;font-size:13.4px;line-height:1.9;color:#6f4a0c}
.strat b{display:block;margin-bottom:3px;color:var(--amber)}

.test{background:var(--paper-2);border:1px solid var(--line-2);
  border-radius:var(--r-md);padding:12px 13px}
.test+.test{margin-top:9px}
.test-h{font-size:11.5px;font-weight:800;color:var(--muted);margin:0 0 7px}
.opts{list-style:none;margin:9px 0 0;padding:0;display:grid;gap:5px}
.opts li{font-family:var(--en);direction:ltr;text-align:left;font-size:13.5px;
  background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;
  display:flex;gap:8px;transition:.15s}
.opts li .k{font-weight:700;color:var(--muted);flex:none}
.test.revealed .opts li.right{background:var(--moss-soft);border-color:rgba(74,122,51,.4)}
.test.revealed .opts li.right .k{color:var(--moss)}
.reveal{margin-top:9px;font-size:12.5px;font-weight:700;color:var(--teal);
  border:1px dashed rgba(15,111,106,.4);border-radius:8px;padding:5px 11px}
.why{margin:9px 0 0;font-size:13.2px;line-height:1.9;color:var(--ink-soft);
  background:var(--moss-soft);border:1px solid rgba(74,122,51,.2);
  border-radius:var(--r-sm);padding:9px 11px}

/* nav */
.pager{display:flex;gap:9px;justify-content:space-between;margin-top:16px}
.pager button{flex:1;height:40px;border-radius:var(--r-md);border:1px solid var(--line);
  background:var(--paper);font-size:13.5px;font-weight:700;color:var(--ink-soft);transition:.15s}
.pager button:hover:not(:disabled){background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.pager button:disabled{opacity:.4;cursor:not-allowed}

.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty h2{margin:0 0 6px;font-size:17px;color:var(--ink)}
.empty p{margin:0;font-size:13.5px}

/* compact */
body.compact{font-size:14px}
body.compact .card{padding:12px 14px;margin-bottom:9px}
body.compact .card-h{margin-bottom:9px;padding-bottom:7px}
body.compact .para,body.compact .bul,body.compact .sbody .note,
body.compact .ref-box .note{font-size:12.8px;line-height:1.75}
body.compact .en-line,body.compact .opts li{font-size:13.2px;line-height:1.6}
body.compact .banner{padding:13px 16px}
body.compact .banner h2{font-size:25px}
body.compact .blk+.blk{margin-top:9px}
body.compact .sitem{padding:9px 10px}

@media (max-width:640px){
  .brand p{display:none}
  .search-wrap{max-width:none}
  .banner h2{font-size:25px}
  .page{padding:14px 12px 60px}
}
@media print{
  .hdr,.drawer,.scrim,.wordbar,.pager,.banner-act,.reveal{display:none !important}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
  .why{display:block !important}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <button class="ib" id="menuBtn" aria-label="فهرست درس‌ها" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <div class="mark">و</div>
      <div>
        <h1>کاتالوگ واژگان دندان‌پزشکی</h1>
        <p>شناسنامه واژه، جملات مستند و تحلیل آزمون دستیاری</p>
      </div>
    </div>
    <div class="hdr-sp"></div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="جست‌وجوی واژه…" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="results">
      <svg class="si" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <div class="results" id="results" hidden role="listbox"></div>
    </div>
    <button class="pill" id="compactBtn" title="تراکم صفحه">
      <svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16"/></svg>
      <span id="compactLbl">فشرده</span>
    </button>
  </div>
</header>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="فهرست درس‌ها">
  <div class="drawer-top">
    <div><strong>درس‌ها</strong><span id="drawerCount"></span></div>
    <button class="ib" id="closeBtn" aria-label="بستن">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <ol class="drawer-list" id="drawerList"></ol>
</aside>

<main class="page">
  <div class="status" id="status" role="status" aria-live="polite" hidden></div>
  <ol class="wordbar" id="wordbar" aria-label="واژه‌های این درس"></ol>
  <div id="root"></div>
</main>

<script>
(() => {
"use strict";

const CFG = { count: 97, dir: "lessons", file: n => `lesson-${String(n).padStart(3,"0")}.md` };

const S = { lesson:null, num:1, idx:0, cache:new Map(), index:null, sel:-1 };
const $ = id => document.getElementById(id);
const el = { menu:$("menuBtn"), close:$("closeBtn"), scrim:$("scrim"), drawer:$("drawer"),
  list:$("drawerList"), dcount:$("drawerCount"), bar:$("wordbar"), root:$("root"),
  status:$("status"), search:$("search"), results:$("results"),
  compact:$("compactBtn"), compactLbl:$("compactLbl") };

const FA = "۰۱۲۳۴۵۶۷۸۹";
const fa = v => String(v).replace(/\d/g, d => FA[+d]);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const ICON = {
  book:'<path d="M4 5a2 2 0 0 1 2-2h11v18H6a2 2 0 0 1-2-2z"/><path d="M9 3v18"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="m15 9-2 5-5 2 2-5z"/>',
  quote:'<path d="M6 15a3 3 0 1 1 3-3v1a5 5 0 0 1-4 5"/><path d="M16 15a3 3 0 1 1 3-3v1a5 5 0 0 1-4 5"/>',
  pulse:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',
  swap:'<path d="M7 4 3 8l4 4"/><path d="M3 8h13a4 4 0 0 1 0 8h-1"/><path d="m17 20 4-4-4-4"/>',
  award:'<circle cx="12" cy="9" r="5"/><path d="m8.5 13-1.5 8 5-3 5 3-1.5-8"/>',
  vol:'<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'
};
const svg = p => `<svg viewBox="0 0 24 24">${p}</svg>`;

/* ============================ markdown parsing ============================ */

// ==tone|text==  ->  <mark class="hl hl-tone">text</mark>
function inline(raw){
  let s = esc(raw);
  s = s.replace(/==([a-z-]+)\|([^=]+)==/g, (_,t,w) => `<mark class="hl ${esc(t)}">${w}</mark>`);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return s;
}

/** Split a section body into ordered blocks keyed by their **label**. */
function blocks(body){
  const out = [];
  let cur = { label:null, lines:[] };
  for (const line of body.split("\n")){
    // A label is a whole line in bold, optionally followed by " — source".
    const m = line.match(/^\*\*(.+?)\*\*(?:\s+—\s*(.+?))?\s*$/);
    if (m){
      if (cur.label || cur.lines.some(l => l.trim())) out.push(cur);
      cur = { label:(m[2] ? `${m[1].trim()} — ${m[2].trim()}` : m[1].trim()), lines:[] };
    } else cur.lines.push(line);
  }
  if (cur.label || cur.lines.some(l => l.trim())) out.push(cur);
  return out;
}

const paras = lines => {
  const out = []; let buf = [];
  for (const l of lines){
    if (!l.trim()){ if (buf.length){ out.push(buf.join(" ").trim()); buf = []; } }
    else buf.push(l.trim());
  }
  if (buf.length) out.push(buf.join(" ").trim());
  return out.filter(Boolean);
};
const items = lines => lines.map(l => l.match(/^-\s+(.*)$/)).filter(Boolean).map(m => m[1].trim());

/** "1. sentence" then an indented Persian note line. */
function numbered(lines){
  const out = [];
  for (const l of lines){
    const m = l.match(/^(\d+)\.\s+(.*)$/);
    if (m){ out.push({ en:m[2].trim(), note:"" }); continue; }
    if (out.length && l.trim()){
      const last = out[out.length-1];
      last.note += (last.note ? " " : "") + l.trim();
    }
  }
  return out;
}

function parseWord(block){
  const head = block.match(/^###\s+(V\d+)\.\s+(.+)$/m);
  const w = { id:head[1], word:head[2].trim(), meta:{}, sections:{} };

  const metaLine = block.match(/^\*\*نقش:\*\*.*$/m);
  if (metaLine){
    for (const part of metaLine[0].split("·")){
      const m = part.match(/\*\*(.+?):\*\*\s*(.+)/);
      if (m) w.meta[m[1].trim()] = m[2].trim();
    }
  }

  const marks = [...block.matchAll(/^####\s+(.+)$/gm)];
  marks.forEach((m,i) => {
    const end = i+1 < marks.length ? marks[i+1].index : block.length;
    w.sections[m[1].trim()] = block.slice(m.index + m[0].length, end).trim();
  });
  return w;
}

function parseLesson(md){
  const marks = [...md.matchAll(/^###\s+V\d+\.\s+.+$/gm)];
  return marks.map((m,i) =>
    parseWord(md.slice(m.index, i+1 < marks.length ? marks[i+1].index : md.length)));
}

/* ============================== rendering =============================== */

const card = (tone, icon, title, body, hint) => body ? `
  <section class="card t-${tone}">
    <div class="card-h"><div class="ic">${svg(icon)}</div><h3>${esc(title)}</h3>
      ${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>
    ${body}
  </section>` : "";

const blk = (label, html) => html ? `<div class="blk">
  ${label ? `<p class="lbl">${esc(label)}</p>` : ""}${html}</div>` : "";

function renderMeaning(body){
  if (!body) return "";
  let html = "";
  for (const b of blocks(body)){
    const li = items(b.lines);
    const ps = paras(b.lines.filter(l => !/^-\s/.test(l)));
    if (li.length && /معادل/.test(b.label || ""))
      html += blk(b.label, `<div class="chips">${li.map(x => `<span class="chip">${inline(x)}</span>`).join("")}</div>`);
    else if (ps.length)
      html += blk(b.label, `<div class="panel"><p class="para">${inline(ps.join(" "))}</p></div>`);
    else if (li.length)
      html += blk(b.label, `<ul class="bul">${li.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`);
  }
  return html;
}

function renderConcept(body){
  if (!body) return "";
  let html = "";
  for (const b of blocks(body)){
    const ps = paras(b.lines);
    if (!ps.length) continue;
    const text = ps.join(" ").replace(/^`|`$/g, "");
    html += blk(b.label, /تعریف/.test(b.label || "")
      ? `<p class="def-line">${esc(text)}</p>`
      : `<div class="panel"><p class="para">${inline(text)}</p></div>`);
  }
  return html;
}

function renderSentences(body){
  if (!body) return "";
  let html = "";
  for (const b of blocks(body)){
    const label = b.label || "";
    if (/رفرنس/.test(label)){
      const quote = b.lines.filter(l => /^>\s?/.test(l)).map(l => l.replace(/^>\s?/, "")).join(" ").trim();
      const note = paras(b.lines.filter(l => !/^>\s?/.test(l))).join(" ");
      const src = label.split("—")[1];
      html += `<div class="blk"><div class="ref-box">
        <div class="ref-top"><span class="badge">جمله مبتنی بر رفرنس</span>
          ${src ? `<span class="src">${esc(src.trim())}</span>` : ""}</div>
        <p class="en-line">${inline(quote)}</p>
        ${note ? `<p class="note">${inline(note)}</p>` : ""}</div></div>`;
    } else {
      const list = numbered(b.lines);
      if (!list.length) continue;
      html += blk(label, `<ul class="slist">${list.map((s,i) => `
        <li class="sitem"><span class="snum">${fa(i+1)}</span><div class="sbody">
          <p class="en-line">${inline(s.en)}</p>
          ${s.note ? `<p class="note">${inline(s.note)}</p>` : ""}</div></li>`).join("")}</ul>`);
    }
  }
  return html;
}

const renderClinical = body => body
  ? `<div class="panel"><p class="para">${inline(paras(body.split("\n")).join(" "))}</p></div>` : "";

function renderLookalikes(body){
  if (!body) return "";
  const rows = items(body.split("\n")).map(raw => {
    const m = raw.match(/^\*\*(.+?)\*\*\s*(?:\((.+?)\))?\s*(?:—\s*(.*))?$/);
    return m ? { w:m[1], pos:m[2] || "", fa:m[3] || "" } : { w:raw, pos:"", fa:"" };
  });
  if (!rows.length) return "";
  return `<div class="lgrid">${rows.map(r => `<div class="lcard">
    <b>${esc(r.w)}</b>${r.pos ? `<i>${esc(r.pos)}</i>` : ""}
    ${r.fa ? `<p>${inline(r.fa)}</p>` : ""}</div>`).join("")}</div>`;
}

function renderExam(body, word){
  if (!body) return "";
  let syn = "", ant = "", brief = "", strat = "", tests = "", ti = 0;

  for (const b of blocks(body)){
    const label = b.label || "";
    const li = items(b.lines);
    const ps = paras(b.lines.filter(l =>
      !/^-\s/.test(l) && !/^[A-D]\.\s/.test(l) && !/^\*\*پاسخ/.test(l)));

    if (/مترادف/.test(label) && li.length)
      syn = blk(label, `<div class="chips">${li.map(x => `<span class="chip en g">${esc(x)}</span>`).join("")}</div>`);
    else if (/متضاد/.test(label) && li.length)
      ant = blk(label, `<div class="chips">${li.map(x => `<span class="chip en r">${esc(x)}</span>`).join("")}</div>`);
    else if (/چکیده/.test(label) && li.length)
      brief = blk(label, `<ul class="bul">${li.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`);
    else if (/استراتژی/.test(label) && ps.length)
      strat = `<div class="blk"><div class="strat"><b>${esc(label)}</b>${inline(ps.join(" "))}</div></div>`;
    else if (/^تست/.test(label)){
      const opts = b.lines.map(l => l.match(/^([A-D])\.\s+(.+)$/)).filter(Boolean);
      const ansM = b.lines.join("\n").match(/\*\*پاسخ:\*\*\s*([A-D])/);
      const ans = ansM ? ansM[1] : null;
      const q = ps[0] || "", why = ps.slice(1).join(" ");
      const uid = `t-${word.id}-${ti++}`;
      tests += `<div class="test" id="${uid}">
        <p class="test-h">${esc(label)}</p>
        <p class="en-line">${inline(q)}</p>
        <ul class="opts">${opts.map(o => `<li class="${o[1] === ans ? "right" : ""}">
          <span class="k">${o[1]}</span><span>${esc(o[2])}</span></li>`).join("")}</ul>
        <button class="reveal" data-reveal="${uid}">نمایش پاسخ و تحلیل</button>
        ${why ? `<p class="why" hidden>${inline(why)}</p>` : ""}</div>`;
    }
  }

  const axis = (syn || ant) ? `<div class="blk"><div class="axis">${syn}${ant}</div></div>` : "";
  return brief + axis + strat + (tests ? `<div class="blk">${tests}</div>` : "");
}

function renderWord(w){
  const sec = w.sections, meta = w.meta, tags = [];
  if (meta["نقش"]) tags.push(`<span class="tag">${esc(meta["نقش"])}</span>`);
  if (meta["POS"]) tags.push(`<span class="tag i">${esc(meta["POS"])}</span>`);
  if (meta["حوزه"]) tags.push(`<span class="tag a">${esc(meta["حوزه"])}</span>`);

  el.root.innerHTML = `
  <article class="poster" id="poster" tabindex="-1">
    <div class="banner">
      <div class="banner-row">
        <div>
          <h2>${esc(w.word)}</h2>
          <div class="tagrow">${tags.join("")}</div>
        </div>
        <div class="banner-act">
          <button class="ib" id="sayBtn" aria-label="تلفظ واژه">${svg(ICON.vol)}</button>
          <button class="ib" id="copyBtn" aria-label="کپی خلاصه">${svg(ICON.copy)}</button>
        </div>
      </div>
    </div>
    ${card("teal",   ICON.book,    "معنی",                 renderMeaning(sec["معنی"]))}
    ${card("indigo", ICON.compass, "تعریف و مفهوم",        renderConcept(sec["تعریف و مفهوم"]))}
    ${card("sky",    ICON.quote,   "جملات",                renderSentences(sec["جملات"]), "واژه هدف هایلایت شده است")}
    ${card("moss",   ICON.pulse,   "کاربرد تخصصی",         renderClinical(sec["کاربرد تخصصی"]))}
    ${card("amber",  ICON.swap,    "کلمات با املای مشابه", renderLookalikes(sec["کلمات با املای مشابه"]))}
    ${card("rose",   ICON.award,   "روایت آزمونی",         renderExam(sec["روایت آزمونی"], w))}
    <div class="pager">
      <button id="prevBtn" ${S.idx <= 0 ? "disabled" : ""}>واژه قبلی</button>
      <button id="nextBtn" ${S.idx >= S.lesson.length - 1 ? "disabled" : ""}>واژه بعدی</button>
    </div>
  </article>`;
  wireWord(w);
}

/* ============================== behaviour =============================== */

function wireWord(w){
  el.root.querySelectorAll("[data-reveal]").forEach(btn => {
    btn.addEventListener("click", () => {
      const box = $(btn.dataset.reveal);
      box.classList.add("revealed");
      const why = box.querySelector(".why");
      if (why) why.hidden = false;
      btn.remove();
    });
  });
  $("sayBtn")?.addEventListener("click", () => speak(w.word));
  $("copyBtn")?.addEventListener("click", e => copySummary(w, e.currentTarget));
  $("prevBtn")?.addEventListener("click", () => select(S.idx - 1, { scroll:true }));
  $("nextBtn")?.addEventListener("click", () => select(S.idx + 1, { scroll:true }));
}

function speak(word){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word.replace(/\s*\(.*?\)\s*/g, " ").trim());
  u.lang = "en-US"; u.rate = .88;
  const v = speechSynthesis.getVoices().find(x => x.lang?.toLowerCase().startsWith("en"));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

async function copySummary(w, btn){
  const grab = key => (w.sections[key] || "")
    .replace(/^\*\*.+?\*\*$/gm, "")
    .replace(/==[a-z-]+\|([^=]+)==/g, "$1")
    .replace(/^[>\-]\s?/gm, "")
    .replace(/\n{2,}/g, "\n").trim();
  const text = [w.word, "", "معنی:", grab("معنی"), "", "تعریف و مفهوم:",
    grab("تعریف و مفهوم"), "", "کاربرد تخصصی:", grab("کاربرد تخصصی")].join("\n");
  try {
    await navigator.clipboard.writeText(text);
    btn.style.background = "var(--moss-soft)"; btn.style.color = "var(--moss)";
    setTimeout(() => { btn.style.background = ""; btn.style.color = ""; }, 900);
  } catch { /* clipboard unavailable */ }
}

function status(msg, err){
  el.status.hidden = !msg;
  el.status.textContent = msg || "";
  el.status.classList.toggle("err", !!err);
}

function renderBar(){
  el.bar.innerHTML = S.lesson.map((w,i) =>
    `<li><button data-i="${i}" class="${i === S.idx ? "on" : ""}">${esc(w.word)}</button></li>`).join("");
  el.bar.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => select(Number(b.dataset.i), { scroll:true })));
}

function renderDrawer(){
  el.dcount.textContent = `${fa(CFG.count)} درس`;
  el.list.innerHTML = Array.from({ length: CFG.count }, (_,i) => {
    const n = i + 1;
    return `<li><button data-n="${n}" class="${n === S.num ? "on" : ""}">
      <span class="dnum">${fa(String(n).padStart(3,"0"))}</span>
      <span>درس ${fa(n)}</span></button></li>`;
  }).join("");
  el.list.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => { load(Number(b.dataset.n)); closeDrawer(); }));
}

function select(i, opts = {}){
  if (!S.lesson || i < 0 || i >= S.lesson.length) return;
  S.idx = i;
  renderBar();
  renderWord(S.lesson[i]);
  if (!opts.silent) location.hash = `#/lesson/${S.num}/word/${S.lesson[i].id}`;
  if (opts.scroll) $("poster")?.scrollIntoView({ block:"start", behavior:"smooth" });
}

async function fetchLesson(n){
  if (S.cache.has(n)) return S.cache.get(n);
  const res = await fetch(`${CFG.dir}/${CFG.file(n)}`, { cache:"no-cache" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const words = parseLesson(await res.text());
  if (!words.length) throw new Error("empty lesson");
  S.cache.set(n, words);
  return words;
}

async function load(n, wordId){
  status(`در حال بارگذاری درس ${fa(n)}…`);
  try {
    S.lesson = await fetchLesson(n);
    S.num = n;
    localStorage.setItem("dm-last-lesson", String(n));
    status("");
    renderDrawer();
    const found = wordId ? S.lesson.findIndex(w => w.id === wordId) : 0;
    select(found >= 0 ? found : 0);
  } catch {
    status(`درس ${fa(n)} بارگذاری نشد.`, true);
    el.root.innerHTML = `<div class="empty"><h2>محتوایی نمایش داده نشد</h2>
      <p>اگر فایل را مستقیم باز کرده‌اید، در پوشه پروژه <code>python3 -m http.server 8080</code> را اجرا کنید.</p></div>`;
  }
}

/* ------------------------------- search -------------------------------- */

async function ensureIndex(){
  if (S.index) return S.index;
  try {
    const res = await fetch(`${CFG.dir}/index.json`, { cache:"no-cache" });
    S.index = res.ok ? await res.json() : [];
  } catch { S.index = []; }
  return S.index;
}

function hideResults(){
  el.results.hidden = true;
  el.search.setAttribute("aria-expanded","false");
  S.sel = -1;
}

async function runSearch(){
  const q = el.search.value.trim().toLowerCase();
  if (q.length < 2) return hideResults();
  const idx = await ensureIndex();
  const hits = idx.filter(r => r.w.toLowerCase().includes(q) || (r.fa || "").includes(q)).slice(0, 40);
  el.results.hidden = false;
  el.search.setAttribute("aria-expanded","true");
  S.sel = -1;
  el.results.innerHTML = hits.length
    ? hits.map(r => `<button role="option" data-l="${r.l}" data-id="${r.id}">
        <b>${esc(r.w)}</b>${r.fa ? ` — ${esc(r.fa)}` : ""}<span> · درس ${fa(r.l)}</span></button>`).join("")
    : `<div class="none">واژه‌ای یافت نشد</div>`;
  el.results.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => {
      hideResults(); el.search.value = "";
      load(Number(b.dataset.l), b.dataset.id);
    }));
}

/* -------------------------------- shell -------------------------------- */

const openDrawer = () => { el.drawer.classList.add("on"); el.scrim.classList.add("on");
  el.menu.setAttribute("aria-expanded","true"); };
const closeDrawer = () => { el.drawer.classList.remove("on"); el.scrim.classList.remove("on");
  el.menu.setAttribute("aria-expanded","false"); };

el.menu.addEventListener("click", () => el.drawer.classList.contains("on") ? closeDrawer() : openDrawer());
el.close.addEventListener("click", closeDrawer);
el.scrim.addEventListener("click", closeDrawer);

el.compact.addEventListener("click", () => {
  const on = document.body.classList.toggle("compact");
  el.compact.classList.toggle("on", on);
  el.compactLbl.textContent = on ? "عادی" : "فشرده";
  localStorage.setItem("dm-compact", on ? "1" : "0");
});
if (localStorage.getItem("dm-compact") === "1") el.compact.click();

let searchTimer;
el.search.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 130); });
el.search.addEventListener("focus", runSearch);
document.addEventListener("click", e => { if (!e.target.closest(".search-wrap")) hideResults(); });
el.search.addEventListener("keydown", e => {
  const opts = [...el.results.querySelectorAll("button")];
  if (e.key === "Escape") return hideResults();
  if (!opts.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    S.sel = (S.sel + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
    opts.forEach((o,i) => o.setAttribute("aria-selected", i === S.sel));
    opts[S.sel].scrollIntoView({ block:"nearest" });
  } else if (e.key === "Enter" && S.sel >= 0){ e.preventDefault(); opts[S.sel].click(); }
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") select(S.idx + 1, { scroll:true });
  if (e.key === "ArrowRight") select(S.idx - 1, { scroll:true });
  if (e.key === "Escape") closeDrawer();
  if (e.key === "/"){ e.preventDefault(); el.search.focus(); }
});

window.addEventListener("hashchange", route);

function route(){
  const m = location.hash.match(/^#\/lesson\/(\d+)(?:\/word\/(V\d+))?/);
  if (!m){
    const saved = Number(localStorage.getItem("dm-last-lesson")) || 1;
    return load(Math.min(CFG.count, Math.max(1, saved)));
  }
  const n = Math.min(CFG.count, Math.max(1, Number(m[1]) || 1));
  if (n === S.num && S.lesson){
    const i = m[2] ? S.lesson.findIndex(w => w.id === m[2]) : 0;
    if (i >= 0 && i !== S.idx) select(i, { silent:true });
    return;
  }
  load(n, m[2]);
}

if ("speechSynthesis" in window) speechSynthesis.getVoices();
renderDrawer();
route();
})();
</script>
