<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="کاتالوگ تعاملی واژگان دندان‌پزشکی با نمایش بولت‌پوینتی درسنامه‌های محلی">
  <meta name="theme-color" content="#193b56">
  <title>کاتالوگ واژگان دندان‌پزشکی</title>

  <style>
    :root {
      color-scheme: light;
      --font-fa: "Vazirmatn", "IRANSansX", "Segoe UI", Tahoma, Arial, sans-serif;
      --font-en: "Aptos", "Segoe UI", Georgia, "Times New Roman", serif;

      --ink: #1f2d3d;
      --muted: #6d7888;
      --navy: #193b56;
      --navy-2: #285d7c;
      --canvas: #f5f4ef;
      --paper: #fffefb;
      --line: #dfe4e7;
      --shadow: 0 18px 55px rgba(25, 59, 86, .10);
      --shadow-soft: 0 7px 22px rgba(25, 59, 86, .07);

      --purple: #7661a9;
      --purple-soft: #f0ebfa;
      --blue: #3479a7;
      --blue-soft: #eaf4fb;
      --green: #408267;
      --green-soft: #eaf5ef;
      --yellow: #a77a22;
      --yellow-soft: #fff7de;
      --pink: #a45468;
      --pink-soft: #fbecef;
      --orange: #a9672a;
      --orange-soft: #fff0e3;
      --teal: #287c7a;
      --teal-soft: #e7f5f3;

      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 13px;
      --header-height: 68px;
      --page-width: 1100px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% -4%, rgba(118, 97, 169, .09), transparent 24rem),
        radial-gradient(circle at 92% 4%, rgba(52, 121, 167, .08), transparent 25rem),
        var(--canvas);
      font-family: var(--font-fa);
      line-height: 1.85;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .34;
      background-image: radial-gradient(rgba(25, 59, 86, .13) .55px, transparent .55px);
      background-size: 18px 18px;
    }

    button,
    input { font: inherit; }
    button:not(:disabled) { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    [hidden] { display: none !important; }

    :focus-visible {
      outline: 3px solid rgba(52, 121, 167, .28);
      outline-offset: 3px;
    }

    .ltr {
      direction: ltr;
      text-align: left;
      unicode-bidi: plaintext;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      min-height: var(--header-height);
      border-bottom: 1px solid rgba(223, 228, 231, .9);
      background: rgba(255, 254, 251, .92);
      backdrop-filter: blur(17px);
    }

    .header-inner {
      width: min(var(--page-width), calc(100% - 26px));
      min-height: var(--header-height);
      margin: auto;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 48px;
      align-items: center;
      gap: 12px;
    }

    .icon-button {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--navy);
      background: var(--paper);
      box-shadow: 0 2px 0 rgba(25, 59, 86, .025);
    }

    .icon-button:hover { background: #f7fafb; }

    .menu-lines {
      width: 21px;
      display: grid;
      gap: 5px;
    }

    .menu-lines span {
      height: 2px;
      border-radius: 999px;
      background: currentColor;
    }

    .brand {
      min-width: 0;
      text-align: center;
    }

    .brand h1 {
      margin: 0;
      overflow: hidden;
      color: var(--navy);
      font-size: 1rem;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: .71rem;
    }

    .header-space { width: 46px; height: 46px; }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      z-index: 39;
      background: rgba(14, 28, 39, .45);
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s ease, visibility .2s ease;
    }

    .drawer-overlay.is-open {
      opacity: 1;
      visibility: visible;
    }

    .drawer {
      position: fixed;
      inset-block: 0;
      right: 0;
      z-index: 40;
      width: min(370px, 89vw);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border-left: 1px solid var(--line);
      background: var(--paper);
      box-shadow: 0 30px 90px rgba(14, 28, 39, .25);
      transform: translateX(105%);
      transition: transform .24s ease;
    }

    .drawer.is-open { transform: translateX(0); }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 19px;
      border-bottom: 1px solid var(--line);
    }

    .drawer-header h2 {
      margin: 0;
      color: var(--navy);
      font-size: 1rem;
    }

    .drawer-header p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: .75rem;
    }

    .lesson-menu {
      margin: 0;
      padding: 12px;
      overflow: auto;
      list-style: none;
    }

    .lesson-menu li + li { margin-top: 4px; }

    .lesson-menu button {
      width: 100%;
      min-height: 49px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 9px 13px;
      border: 0;
      border-radius: 12px;
      color: var(--ink);
      background: transparent;
      text-align: right;
    }

    .lesson-menu button:hover { background: #f3f6f7; }

    .lesson-menu button[aria-current="true"] {
      color: var(--navy);
      background: var(--blue-soft);
      font-weight: 800;
    }

    .lesson-menu small {
      color: var(--muted);
      direction: ltr;
      font-size: .7rem;
      font-weight: 600;
    }

    .page {
      width: min(var(--page-width), calc(100% - 26px));
      margin: 28px auto 76px;
    }

    .status {
      min-height: 34px;
      display: grid;
      place-items: center;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }

    .status.is-error { color: #a43b3b; }

    .word-list {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .word-button {
      --word-tone: var(--blue);
      --word-soft: var(--blue-soft);
      width: 100%;
      min-height: 82px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 5px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--word-tone);
      border-radius: 14px;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 1px 0 rgba(25, 59, 86, .02);
      text-align: right;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .word-button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-soft);
    }

    .word-button[aria-current="true"] {
      border-color: var(--word-tone);
      background: var(--word-soft);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--word-tone) 12%, transparent);
    }

    .word-button.tone-1 { --word-tone: var(--purple); --word-soft: var(--purple-soft); }
    .word-button.tone-2 { --word-tone: var(--blue); --word-soft: var(--blue-soft); }
    .word-button.tone-3 { --word-tone: var(--green); --word-soft: var(--green-soft); }
    .word-button.tone-4 { --word-tone: var(--yellow); --word-soft: var(--yellow-soft); }
    .word-button.tone-5 { --word-tone: var(--pink); --word-soft: var(--pink-soft); }

    .word-number {
      color: var(--word-tone);
      font-size: .67rem;
      font-weight: 900;
    }

    .word-name {
      display: block;
      align-self: center;
      overflow-wrap: anywhere;
      direction: ltr;
      text-align: left;
      font-family: var(--font-en);
      font-size: 1rem;
      font-weight: 760;
      line-height: 1.35;
    }

    .word-pos {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      direction: ltr;
      text-align: left;
      font-size: .67rem;
    }

    .empty-state {
      margin-top: 24px;
      padding: 32px 20px;
      border: 1px dashed #cbd3d8;
      border-radius: var(--radius-lg);
      color: var(--muted);
      background: rgba(255, 254, 251, .66);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 4px;
      color: var(--navy);
    }

    .word-poster {
      margin-top: 25px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .poster-topline {
      height: 7px;
      background: linear-gradient(90deg,
        var(--purple) 0 16.6%,
        var(--blue) 16.6% 33.2%,
        var(--green) 33.2% 49.8%,
        var(--yellow) 49.8% 66.4%,
        var(--pink) 66.4% 83%,
        var(--teal) 83% 100%);
    }

    .poster-header {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 18px;
      padding: clamp(24px, 5vw, 46px);
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(234, 244, 251, .72), transparent 45%),
        var(--paper);
    }

    .poster-header::after {
      content: "";
      position: absolute;
      left: 35px;
      bottom: 20px;
      width: 54px;
      height: 54px;
      border: 2px solid rgba(52, 121, 167, .12);
      border-radius: 50%;
      box-shadow: 12px -7px 0 -8px rgba(118, 97, 169, .24);
      pointer-events: none;
    }

    .poster-counter {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
    }

    .poster-title {
      margin: 0;
      color: var(--navy);
      direction: ltr;
      text-align: left;
      font-family: var(--font-en);
      font-size: clamp(2.4rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -.025em;
      line-height: 1.04;
      overflow-wrap: anywhere;
    }

    .pronunciation-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 13px;
      margin-top: 12px;
      direction: ltr;
      text-align: left;
    }

    .phonetic {
      color: var(--blue);
      font-family: var(--font-en);
      font-size: 1rem;
    }

    .persian-pronunciation {
      color: var(--muted);
      direction: rtl;
      font-size: .78rem;
    }

    .sound-button {
      color: #fff;
      border-color: var(--navy);
      background: var(--navy);
      box-shadow: 0 8px 20px rgba(25, 59, 86, .17);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 17px;
    }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      min-height: 29px;
      padding: 3px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, .78);
      font-size: .69rem;
      font-weight: 650;
    }

    .meta-badge.priority {
      color: var(--purple);
      border-color: #d8cbed;
      background: var(--purple-soft);
      font-weight: 900;
    }

    .poster-body {
      padding: clamp(20px, 4vw, 38px);
    }

    .quick-grid,
    .poster-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .quick-grid { margin-bottom: 14px; }

    .poster-card {
      --tone: var(--blue);
      --soft: var(--blue-soft);
      position: relative;
      min-width: 0;
      padding: 20px;
      border: 1px solid color-mix(in srgb, var(--tone) 25%, var(--line));
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, var(--soft), #fff 84%);
      overflow: hidden;
    }

    .poster-card::after {
      content: "";
      position: absolute;
      left: -26px;
      bottom: -32px;
      width: 92px;
      height: 92px;
      border: 2px solid color-mix(in srgb, var(--tone) 15%, transparent);
      border-radius: 50%;
      pointer-events: none;
    }

    .poster-card.tone-purple { --tone: var(--purple); --soft: var(--purple-soft); }
    .poster-card.tone-blue { --tone: var(--blue); --soft: var(--blue-soft); }
    .poster-card.tone-green { --tone: var(--green); --soft: var(--green-soft); }
    .poster-card.tone-yellow { --tone: var(--yellow); --soft: var(--yellow-soft); }
    .poster-card.tone-pink { --tone: var(--pink); --soft: var(--pink-soft); }
    .poster-card.tone-orange { --tone: var(--orange); --soft: var(--orange-soft); }
    .poster-card.tone-teal { --tone: var(--teal); --soft: var(--teal-soft); }
    .poster-card.full { grid-column: 1 / -1; }

    .card-heading {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      color: var(--tone);
      font-size: .95rem;
      line-height: 1.5;
    }

    .card-number {
      width: 27px;
      height: 27px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #fff;
      background: var(--tone);
      font-family: var(--font-en);
      font-size: .72rem;
      font-weight: 900;
    }

    .field-block {
      position: relative;
      z-index: 1;
    }

    .field-block + .field-block {
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px dashed color-mix(in srgb, var(--tone) 22%, var(--line));
    }

    .field-label {
      margin: 0 0 8px;
      color: color-mix(in srgb, var(--tone) 75%, var(--ink));
      font-size: .72rem;
      font-weight: 900;
    }

    .bullet-list {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .bullet-list li {
      position: relative;
      padding-right: 19px;
      overflow-wrap: anywhere;
    }

    .bullet-list li::before {
      content: "";
      position: absolute;
      top: .76em;
      right: 2px;
      width: 7px;
      height: 7px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--tone);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--tone) 35%, transparent);
      transform: translateY(-50%);
    }

    .bullet-list.english {
      direction: ltr;
      text-align: left;
      font-family: var(--font-en);
      line-height: 1.7;
    }

    .bullet-list.english li {
      padding-right: 0;
      padding-left: 19px;
    }

    .bullet-list.english li::before {
      right: auto;
      left: 2px;
    }

    .chip-list {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .chip-list li {
      padding: 6px 10px;
      border: 1px solid color-mix(in srgb, var(--tone) 28%, var(--line));
      border-radius: 999px;
      color: color-mix(in srgb, var(--tone) 74%, var(--ink));
      background: rgba(255, 255, 255, .72);
      font-size: .78rem;
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .chip-list.english {
      direction: ltr;
      justify-content: flex-start;
      font-family: var(--font-en);
      text-align: left;
    }

    .meaning-list li {
      color: var(--navy);
      font-size: 1.05rem;
      font-weight: 850;
    }

    .example-stack {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
    }

    .example-box {
      margin: 0;
      padding: 14px 15px;
      border: 1px solid color-mix(in srgb, var(--tone) 20%, var(--line));
      border-left: 4px solid var(--tone);
      border-radius: 12px;
      background: rgba(255, 255, 255, .75);
    }

    .example-box p { margin: 0; }

    .example-box .english-copy {
      direction: ltr;
      text-align: left;
      font-family: var(--font-en);
      font-size: .98rem;
      line-height: 1.72;
    }

    .example-box .translation {
      margin-top: 8px;
      color: var(--muted);
      font-size: .82rem;
    }

    .comparison-wrap {
      position: relative;
      z-index: 1;
      overflow-x: auto;
      border: 1px solid color-mix(in srgb, var(--tone) 20%, var(--line));
      border-radius: 12px;
      background: rgba(255, 255, 255, .78);
    }

    .comparison-table {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
      font-size: .79rem;
    }

    .comparison-table th,
    .comparison-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: right;
    }

    .comparison-table th {
      color: #fff;
      background: var(--tone);
      font-weight: 850;
    }

    .comparison-table tr:last-child td { border-bottom: 0; }
    .comparison-table td:nth-child(n+2) { direction: ltr; text-align: left; font-family: var(--font-en); }

    .recall-list {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: recall;
    }

    .recall-list li {
      counter-increment: recall;
      position: relative;
      min-height: 58px;
      padding: 11px 45px 11px 12px;
      border: 1px solid color-mix(in srgb, var(--tone) 22%, var(--line));
      border-radius: 11px;
      background: rgba(255, 255, 255, .72);
    }

    .recall-list li::before {
      content: counter(recall);
      position: absolute;
      top: 11px;
      right: 11px;
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: var(--tone);
      font-family: var(--font-en);
      font-size: .7rem;
      font-weight: 900;
    }

    details.catalog-details {
      position: relative;
      z-index: 1;
      border: 1px solid color-mix(in srgb, var(--tone) 22%, var(--line));
      border-radius: 12px;
      background: rgba(255, 255, 255, .7);
      overflow: hidden;
    }

    details.catalog-details + details.catalog-details { margin-top: 10px; }

    details.catalog-details > summary {
      padding: 12px 14px;
      color: color-mix(in srgb, var(--tone) 76%, var(--ink));
      font-weight: 850;
      list-style: none;
      cursor: pointer;
    }

    details.catalog-details > summary::-webkit-details-marker { display: none; }
    details.catalog-details > summary::after { content: "+"; float: left; font-size: 1.05rem; }
    details.catalog-details[open] > summary::after { content: "−"; }

    .details-content {
      padding: 14px;
      border-top: 1px solid color-mix(in srgb, var(--tone) 18%, var(--line));
    }

    .quiz-question {
      margin: 0 0 12px;
      direction: ltr;
      text-align: left;
      font-family: var(--font-en);
      font-size: .98rem;
      font-weight: 760;
    }

    .quiz-options {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .quiz-options li {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: start;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid color-mix(in srgb, var(--tone) 20%, var(--line));
      border-radius: 10px;
      direction: ltr;
      text-align: left;
      background: #fff;
      font-family: var(--font-en);
    }

    .option-letter {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: var(--tone);
      font-size: .7rem;
      font-weight: 900;
    }

    .answer-box {
      padding: 12px 13px;
      border-radius: 10px;
      color: var(--navy);
      background: var(--green-soft);
    }

    .review-track {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .review-track li {
      min-height: 88px;
      padding: 10px;
      border: 1px solid color-mix(in srgb, var(--tone) 22%, var(--line));
      border-radius: 11px;
      background: rgba(255, 255, 255, .78);
      text-align: center;
    }

    .review-time {
      display: block;
      margin-bottom: 5px;
      color: var(--tone);
      font-size: .72rem;
      font-weight: 900;
    }

    .review-task {
      display: block;
      color: var(--muted);
      font-size: .7rem;
      line-height: 1.6;
    }

    .poster-navigation {
      position: sticky;
      bottom: 0;
      z-index: 6;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 14px clamp(20px, 4vw, 38px);
      border-top: 1px solid var(--line);
      background: rgba(255, 254, 251, .94);
      backdrop-filter: blur(14px);
    }

    .nav-button {
      min-height: 43px;
      padding: 8px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--navy);
      background: var(--paper);
      font-weight: 850;
    }

    .nav-button:hover:not(:disabled) { background: var(--blue-soft); }

    .loading-dots::after {
      content: "";
      display: inline-block;
      width: 1.3em;
      text-align: right;
      animation: dots 1.15s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }

    @media (max-width: 920px) {
      .word-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .review-track { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .page { margin-top: 20px; }
      .quick-grid,
      .poster-grid { grid-template-columns: 1fr; }
      .poster-card.full { grid-column: auto; }
      .recall-list { grid-template-columns: 1fr; }
      .poster-header { grid-template-columns: minmax(0, 1fr) 46px; }
    }

    @media (max-width: 480px) {
      .header-inner,
      .page { width: calc(100% - 18px); }
      .brand p { display: none; }
      .word-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
      .word-button { min-height: 76px; padding: 9px; }
      .word-name { font-size: .92rem; }
      .poster-title { font-size: 2.55rem; }
      .poster-header,
      .poster-body { padding-inline: 17px; }
      .poster-card { padding: 16px; }
      .review-track { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .poster-navigation { padding-inline: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media print {
      .app-header,
      .drawer,
      .drawer-overlay,
      .status,
      .word-list,
      .empty-state,
      .poster-navigation,
      .sound-button { display: none !important; }

      body { background: #fff; }
      body::before { display: none; }
      .page { width: 100%; margin: 0; }
      .word-poster { margin: 0; border: 0; box-shadow: none; }
      .poster-card { break-inside: avoid; }
      details.catalog-details:not([open]) { display: none; }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <button id="menu-button" class="icon-button" type="button" aria-label="باز کردن فهرست درس‌ها" aria-controls="lesson-drawer" aria-expanded="false">
        <span class="menu-lines" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>

      <div class="brand">
        <h1>کاتالوگ واژگان دندان‌پزشکی</h1>
        <p>مرور تصویری، بولت‌پوینتی و تعاملی</p>
      </div>

      <div class="header-space" aria-hidden="true"></div>
    </div>
  </header>

  <div id="drawer-overlay" class="drawer-overlay" aria-hidden="true"></div>

  <aside id="lesson-drawer" class="drawer" aria-label="فهرست درس‌ها" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <h2>فهرست درس‌ها</h2>
        <p>درس موردنظر را انتخاب کنید.</p>
      </div>
      <button id="close-button" class="icon-button" type="button" aria-label="بستن فهرست">×</button>
    </div>
    <ol id="lesson-menu" class="lesson-menu"></ol>
  </aside>

  <main class="page">
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <ol id="word-list" class="word-list" aria-label="واژه‌های درس"></ol>

    <section id="empty-state" class="empty-state">
      <strong>یک واژه را انتخاب کنید</strong>
      <span>درسنامه کامل همان واژه در قالب کاتالوگ آموزشی نمایش داده می‌شود.</span>
    </section>

    <div id="article-root" aria-live="polite"></div>
  </main>

  <script>
    "use strict";

    const CONFIG = {
      lessonCount: 97,
      lessonFolder: "lessons",
      filename(number) {
        return `lesson-${String(number).padStart(3, "0")}.md`;
      }
    };

    const state = {
      currentLesson: 1,
      currentWordIndex: -1,
      lesson: null,
      drawerOpen: false,
      cache: new Map(),
      speechReady: "speechSynthesis" in window
    };

    const refs = {
      menuButton: document.getElementById("menu-button"),
      closeButton: document.getElementById("close-button"),
      drawer: document.getElementById("lesson-drawer"),
      overlay: document.getElementById("drawer-overlay"),
      lessonMenu: document.getElementById("lesson-menu"),
      status: document.getElementById("status"),
      wordList: document.getElementById("word-list"),
      emptyState: document.getElementById("empty-state"),
      articleRoot: document.getElementById("article-root")
    };

    function toFaNumber(value) {
      return new Intl.NumberFormat("fa-IR", { useGrouping: false }).format(value);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function cleanText(value) {
      if (!value) return null;
      const cleaned = String(value)
        .replace(/`([^`]+)`/g, "$1")
        .replace(/\*\*([^*]+)\*\*/g, "$1")
        .replace(/\[([^\]]+)\]\([^\)]+\)/g, "$1")
        .replace(/<[^>]+>/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      return cleaned || null;
    }

    function slugify(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9\u0600-\u06ff]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function escapeRegExp(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function extractField(block, label) {
      const pattern = new RegExp(`^-\\s*\\*\\*${escapeRegExp(label)}:\\*\\*\\s*(.+)$`, "mi");
      const match = block.match(pattern);
      return match ? cleanText(match[1]) : null;
    }

    function extractSection(block, number, nextNumber) {
      const end = nextNumber ? `(?=^####\\s+${nextNumber}\\))` : "(?=^####\\s+\\d+\\)|$)";
      const pattern = new RegExp(`^####\\s+${number}\\)[^\\n]*\\n([\\s\\S]*?)${end}`, "mi");
      const match = block.match(pattern);
      return match ? match[1].trim() : "";
    }

    function parseMarkdownTable(section) {
      const rows = section
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.startsWith("|") && line.endsWith("|"))
        .map(line => line.slice(1, -1).split("|").map(cell => cleanText(cell) || ""));

      if (rows.length < 2) return { headers: [], rows: [] };
      const usefulRows = rows.filter(row => !row.every(cell => /^:?-{2,}:?$/.test(cell.replace(/\s/g, ""))));
      if (usefulRows.length < 2) return { headers: [], rows: [] };
      return { headers: usefulRows[0], rows: usefulRows.slice(1) };
    }

    function parseListSection(section) {
      return section
        .split("\n")
        .map(line => line.match(/^\s*[-*]\s+(.+)$/))
        .filter(Boolean)
        .map(match => cleanText(match[1]))
        .filter(Boolean);
    }

    function parseActiveRecall(block) {
      return extractSection(block, 7, 8)
        .split("\n")
        .map(line => line.match(/^\s*\d+\.\s+(.+)$/))
        .filter(Boolean)
        .map(match => cleanText(match[1]))
        .filter(Boolean);
    }

    function parseMcq(block) {
      const section = extractSection(block, 8, 9);
      const questionMatch = section.match(/\*\*Question[^\n]*\*\*\s*\n+([^\n]+)/i);
      const options = [];
      const analyses = [];

      for (const line of section.split("\n")) {
        const option = line.match(/^([A-D])\.\s+(.+)$/);
        if (option) options.push({ label: option[1], text: cleanText(option[2]) });

        const analysis = line.match(/^-\s+\*\*([A-D])(?:\s*\([^)]*\))?:\*\*\s*(.+)$/);
        if (analysis) analyses.push({ label: analysis[1], text: cleanText(analysis[2]) });
      }

      return {
        question: questionMatch ? cleanText(questionMatch[1]) : null,
        options,
        analyses,
        correctAnswer: extractField(block, "Correct answer"),
        anchorWord: extractField(block, "Anchor word"),
        reason: extractField(block, "Semantic compass"),
        inspiration: extractField(block, "Exam inspiration")
      };
    }

    function parseLesson(markdown, lessonNumber) {
      const entries = [];
      const entryPattern = /^###\s+(V\d{4})\.\s+(.+)$/gm;
      const matches = [...markdown.matchAll(entryPattern)];

      matches.forEach((match, index) => {
        const start = match.index;
        const end = index + 1 < matches.length ? matches[index + 1].index : markdown.length;
        const block = markdown.slice(start, end).trim();
        const tier = extractField(block, "Tier");

        entries.push({
          id: match[1],
          word: cleanText(match[2]),
          slug: slugify(match[2]),
          lesson: lessonNumber,
          position: index + 1,

          partOfSpeech: extractField(block, "Part of Speech"),
          ipa: extractField(block, "IPA"),
          persianPronunciation: extractField(block, "تلفظ کمکی فارسی"),
          englishDefinition: extractField(block, "Precise English Definition"),
          persianMeaning: extractField(block, "معادل فارسی"),
          register: extractField(block, "Register"),
          semanticProfile: extractField(block, "Semantic Profile"),
          priority: tier ? (tier.match(/[ABC]/i)?.[0]?.toUpperCase() || null) : null,
          origin: extractField(block, "Origin"),

          originalForm: extractField(block, "شکل اولیه"),
          teacherDefinition: extractField(block, "تعریف مدرس"),
          teacherTranslation: extractField(block, "ترجمه مدرس"),
          teacherExample: extractField(block, "مثال مدرس"),
          messageIds: extractField(block, "Message IDs"),
          correctionNote: extractField(block, "یادداشت اصلاحی"),

          wordFamily: extractField(block, "Word Family"),
          root: extractField(block, "Root / Prefix / Suffix"),
          grammarPattern: extractField(block, "Grammar Pattern / Preposition"),
          spellingNote: extractField(block, "Spelling Note"),

          collocations: extractField(block, "Common Collocations"),
          generalExample: extractField(block, "General Example"),
          academicExample: extractField(block, "Academic Example"),
          exactReference: extractField(block, "Exact Reference Excerpt"),
          referenceStatus: extractField(block, "Reference status"),
          adaptedSentence: extractField(block, "Reference-grounded Adapted Sentence"),
          preciseTranslation: extractField(block, "ترجمه دقیق"),
          clinicalApplication: extractField(block, "Clinical Application"),
          domain: extractField(block, "Dental Domain"),
          confidence: extractField(block, "Confidence"),

          semanticNetwork: parseMarkdownTable(extractSection(block, 5, 6)),
          examAppeared: extractField(block, "Appeared in exam bank"),
          examNote: extractField(block, "Exam note"),
          activeRecall: parseActiveRecall(block),
          mcq: parseMcq(block),
          spacedReview: parseMarkdownTable(extractSection(block, 9, 10)),
          sourceLines: parseListSection(extractSection(block, 10, null))
        });
      });

      return { number: lessonNumber, words: entries };
    }

    function splitOutsideBrackets(text, separators) {
      const result = [];
      let buffer = "";
      let depth = 0;
      let quote = null;

      for (const char of text) {
        if ((char === '"' || char === "“" || char === "”" || char === "'") && depth === 0) {
          quote = quote === char ? null : (quote || char);
        }
        if (!quote) {
          if (char === "(" || char === "[" || char === "{") depth += 1;
          if (char === ")" || char === "]" || char === "}") depth = Math.max(0, depth - 1);
        }

        if (!quote && depth === 0 && separators.includes(char)) {
          if (buffer.trim()) result.push(buffer.trim());
          buffer = "";
        } else {
          buffer += char;
        }
      }

      if (buffer.trim()) result.push(buffer.trim());
      return result;
    }

    function splitContent(value, { splitComma = false } = {}) {
      const text = cleanText(value);
      if (!text) return [];

      const normalized = text
        .replace(/\s*[؛;]\s*(?=مثال\s*:|Example\s*:)/gi, " || ")
        .replace(/\s*[؛;]\s*/g, " || ")
        .replace(/\s*\|\|\s*/g, " || ");

      let pieces = normalized.split(" || ").map(item => item.trim()).filter(Boolean);

      if (splitComma) {
        pieces = pieces.flatMap(piece => {
          if (/^(مثال|example)\s*:/i.test(piece)) return [piece];
          if (piece.length > 190) return [piece];
          const commaParts = splitOutsideBrackets(piece, ["،", ","]);
          return commaParts.length > 1 && commaParts.every(item => item.length < 90)
            ? commaParts
            : [piece];
        });
      }

      return [...new Set(pieces.map(item => item.replace(/^[-–—•]\s*/, "").trim()).filter(Boolean))];
    }

    function renderItems(items, { english = false, chips = false, extraClass = "" } = {}) {
      const safeItems = items.filter(Boolean);
      if (!safeItems.length) return "";
      const className = chips ? "chip-list" : "bullet-list";
      return `<ul class="${className}${english ? " english" : ""}${extraClass ? ` ${extraClass}` : ""}">${safeItems.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function renderField(label, value, options = {}) {
      const items = Array.isArray(value) ? value : splitContent(value, { splitComma: options.splitComma });
      if (!items.length) return "";
      return `
        <div class="field-block">
          <p class="field-label">${escapeHtml(label)}</p>
          ${renderItems(items, options)}
        </div>
      `;
    }

    function renderCard({ number, title, tone, body, full = false }) {
      if (!body) return "";
      return `
        <section class="poster-card tone-${tone}${full ? " full" : ""}">
          <h4 class="card-heading"><span class="card-number">${escapeHtml(number)}</span>${escapeHtml(title)}</h4>
          ${body}
        </section>
      `;
    }

    function renderExample(label, english, translation = null) {
      if (!english) return "";
      return `
        <div class="field-block">
          <p class="field-label">${escapeHtml(label)}</p>
          <blockquote class="example-box">
            <p class="english-copy">${escapeHtml(english)}</p>
            ${translation ? `<p class="translation">${escapeHtml(translation)}</p>` : ""}
          </blockquote>
        </div>
      `;
    }

    function renderTable(table) {
      if (!table?.headers?.length || !table?.rows?.length) return "";
      return `
        <div class="comparison-wrap">
          <table class="comparison-table">
            <thead><tr>${table.headers.map(header => `<th>${escapeHtml(header)}</th>`).join("")}</tr></thead>
            <tbody>${table.rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("")}</tbody>
          </table>
        </div>
      `;
    }

    function renderReview(table) {
      if (!table?.rows?.length) return "";
      return `<ol class="review-track">${table.rows.map(row => `
        <li>
          <span class="review-time">${escapeHtml(row[0] || "")}</span>
          <span class="review-task">${escapeHtml(row[1] || "")}</span>
        </li>
      `).join("")}</ol>`;
    }

    function setStatus(message = "", isError = false) {
      refs.status.textContent = message;
      refs.status.classList.toggle("is-error", isError);
    }

    function renderLessonMenu() {
      const fragment = document.createDocumentFragment();

      for (let number = 1; number <= CONFIG.lessonCount; number += 1) {
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.lesson = String(number);
        button.setAttribute("aria-current", number === state.currentLesson ? "true" : "false");
        button.innerHTML = `<span>درس ${toFaNumber(number)}</span><small>${String(number).padStart(3, "0")}</small>`;
        button.addEventListener("click", () => loadLesson(number));
        item.append(button);
        fragment.append(item);
      }

      refs.lessonMenu.replaceChildren(fragment);
    }

    function openDrawer() {
      state.drawerOpen = true;
      refs.drawer.classList.add("is-open");
      refs.overlay.classList.add("is-open");
      refs.drawer.setAttribute("aria-hidden", "false");
      refs.overlay.setAttribute("aria-hidden", "false");
      refs.menuButton.setAttribute("aria-expanded", "true");
      document.body.style.overflow = "hidden";
      refs.closeButton.focus();
    }

    function closeDrawer({ restoreFocus = true } = {}) {
      if (!state.drawerOpen) return;
      state.drawerOpen = false;
      refs.drawer.classList.remove("is-open");
      refs.overlay.classList.remove("is-open");
      refs.drawer.setAttribute("aria-hidden", "true");
      refs.overlay.setAttribute("aria-hidden", "true");
      refs.menuButton.setAttribute("aria-expanded", "false");
      document.body.style.overflow = "";
      if (restoreFocus) refs.menuButton.focus();
    }

    async function fetchLessonFile(number) {
      if (state.cache.has(number)) return state.cache.get(number);

      const filename = CONFIG.filename(number);
      const paths = [`${CONFIG.lessonFolder}/${filename}`, filename];
      let lastError = null;

      for (const path of paths) {
        try {
          const response = await fetch(path, { cache: "no-cache" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const markdown = await response.text();
          const lesson = parseLesson(markdown, number);
          if (!lesson.words.length) throw new Error("No vocabulary entries found");
          state.cache.set(number, lesson);
          return lesson;
        } catch (error) {
          lastError = error;
        }
      }

      throw lastError || new Error("Lesson file could not be loaded");
    }

    async function loadLesson(number, selectedIndex = -1, options = {}) {
      closeDrawer({ restoreFocus: false });
      state.currentLesson = number;
      state.currentWordIndex = -1;
      state.lesson = null;
      renderLessonMenu();
      refs.wordList.replaceChildren();
      refs.articleRoot.replaceChildren();
      refs.emptyState.hidden = true;
      refs.emptyState.innerHTML = `<strong>یک واژه را انتخاب کنید</strong><span>درسنامه کامل همان واژه در قالب کاتالوگ آموزشی نمایش داده می‌شود.</span>`;
      setStatus("در حال بارگذاری", false);
      refs.status.classList.add("loading-dots");

      try {
        const lesson = await fetchLessonFile(number);
        state.lesson = lesson;
        renderWords();
        setStatus("");
        refs.emptyState.hidden = false;

        const targetIndex = selectedIndex >= 0 ? selectedIndex : options.wordId
          ? lesson.words.findIndex(word => word.id === options.wordId || word.slug === options.wordId)
          : -1;

        if (targetIndex >= 0) selectWord(targetIndex, { scroll: false, updateHash: false });
        else updateHash();

        localStorage.setItem("dentalVocabularyLastLesson", String(number));
      } catch (error) {
        setStatus(`فایل ${CONFIG.lessonFolder}/${CONFIG.filename(number)} بارگذاری نشد.`, true);
        refs.emptyState.hidden = false;
        refs.emptyState.innerHTML = `
          <strong>فایل درس در دسترس نیست</strong>
          <span>فایل <bdi class="ltr">${escapeHtml(CONFIG.filename(number))}</bdi> را داخل پوشه <bdi class="ltr">lessons</bdi> قرار دهید.</span>
        `;
        updateHash();
      } finally {
        refs.status.classList.remove("loading-dots");
      }
    }

    function renderWords() {
      if (!state.lesson) return;
      const fragment = document.createDocumentFragment();

      state.lesson.words.forEach((word, index) => {
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.className = `word-button tone-${(index % 5) + 1}`;
        button.dataset.index = String(index);
        button.setAttribute("aria-current", index === state.currentWordIndex ? "true" : "false");
        button.innerHTML = `
          <span class="word-number">${toFaNumber(index + 1)}</span>
          <span>
            <span class="word-name">${escapeHtml(word.word)}</span>
            ${word.partOfSpeech ? `<span class="word-pos">${escapeHtml(word.partOfSpeech)}</span>` : ""}
          </span>
        `;
        button.addEventListener("click", () => selectWord(index));
        item.append(button);
        fragment.append(item);
      });

      refs.wordList.replaceChildren(fragment);
    }

    function renderArticle(word) {
      const meaningBody = [
        renderField("معادل‌های اصلی", word.persianMeaning, { splitComma: true, chips: true, extraClass: "meaning-list" }),
        renderField("ترجمه و توضیح مدرس", word.teacherTranslation, { splitComma: true })
      ].join("");

      const definitionBody = [
        renderField("تعریف دقیق", word.englishDefinition, { english: true }),
        renderField("تعریف مدرس", word.teacherDefinition, { english: true }),
        renderField("اثر انگشت معنایی", word.semanticProfile, { splitComma: true, chips: true })
      ].join("");

      const teacherBody = [
        renderField("شکل ثبت‌شده", word.originalForm, { english: true, chips: true }),
        renderField("توضیح اصلاحی", word.correctionNote),
        renderField("شناسه‌های منبع مدرس", word.messageIds, { splitComma: true, chips: true, english: true })
      ].join("");

      const structureBody = [
        renderField("خانواده واژه", word.wordFamily, { splitComma: true, chips: true, english: true }),
        renderField("ریشه، پیشوند و پسوند", word.root, { splitComma: true, english: true }),
        renderField("الگوی دستوری و حرف اضافه", word.grammarPattern, { splitComma: true, english: true }),
        renderField("نکته املایی", word.spellingNote, { english: true }),
        renderField("ترکیب‌های رایج", word.collocations, { splitComma: true, chips: true, english: true })
      ].join("");

      const examples = [
        renderExample("مثال مدرس", word.teacherExample),
        renderExample("مثال عمومی", word.generalExample),
        renderExample("مثال آکادمیک", word.academicExample),
        renderExample("جمله مبتنی بر رفرنس", word.adaptedSentence, word.preciseTranslation)
      ].join("");

      const clinicalBody = [
        renderField("حوزه کاربرد", word.domain, { splitComma: true, chips: true, english: true }),
        renderField("کاربرد کلینیکال", word.clinicalApplication),
        renderField("سطح اطمینان", word.confidence, { chips: true, english: true }),
        renderField("وضعیت حضور در رفرنس", word.referenceStatus),
        renderField("بخش دقیق رفرنس", word.exactReference, { english: true })
      ].join("");

      const networkBody = renderTable(word.semanticNetwork);

      const recallBody = word.activeRecall.length
        ? `<ol class="recall-list">${word.activeRecall.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ol>`
        : "";

      const quizHasData = word.mcq.question || word.mcq.options.length || word.mcq.correctAnswer;
      const quizBody = quizHasData ? `
        <details class="catalog-details">
          <summary>باز کردن تست</summary>
          <div class="details-content">
            ${word.mcq.question ? `<p class="quiz-question">${escapeHtml(word.mcq.question)}</p>` : ""}
            ${word.mcq.options.length ? `<ol class="quiz-options">${word.mcq.options.map(option => `
              <li><span class="option-letter">${escapeHtml(option.label)}</span><span>${escapeHtml(option.text)}</span></li>
            `).join("")}</ol>` : ""}
          </div>
        </details>

        ${(word.mcq.correctAnswer || word.mcq.reason || word.mcq.analyses.length) ? `
          <details class="catalog-details">
            <summary>نمایش پاسخ و تحلیل</summary>
            <div class="details-content">
              <div class="answer-box">
                ${word.mcq.correctAnswer ? `<strong>پاسخ صحیح:</strong> <bdi class="ltr">${escapeHtml(word.mcq.correctAnswer)}</bdi>` : ""}
                ${word.mcq.anchorWord ? `<div><strong>کلمه لنگر:</strong> <bdi class="ltr">${escapeHtml(word.mcq.anchorWord)}</bdi></div>` : ""}
                ${word.mcq.reason ? `<div><strong>دلیل:</strong> ${escapeHtml(word.mcq.reason)}</div>` : ""}
              </div>
              ${word.mcq.analyses.length ? `<div style="margin-top:12px">${renderItems(word.mcq.analyses.map(item => `${item.label}: ${item.text}`), { english: true })}</div>` : ""}
            </div>
          </details>
        ` : ""}
      ` : "";

      const reviewBody = renderReview(word.spacedReview);

      const evidenceBody = [
        renderField("ظهور در بانک آزمون", word.examAppeared, { english: true, chips: true }),
        renderField("یادداشت آزمون", word.examNote),
        renderField("منبع الهام تست", word.mcq.inspiration),
        renderField("ردگیری منابع", word.sourceLines, { english: true })
      ].join("");

      refs.articleRoot.innerHTML = `
        <article id="word-poster" class="word-poster" tabindex="-1">
          <div class="poster-topline"></div>
          <header class="poster-header">
            <div>
              <p class="poster-counter">واژه ${toFaNumber(word.position)} از ${toFaNumber(state.lesson.words.length)}</p>
              <h2 class="poster-title">${escapeHtml(word.word)}</h2>
              <div class="pronunciation-row">
                ${word.ipa ? `<span class="phonetic">${escapeHtml(word.ipa)}</span>` : ""}
                ${word.persianPronunciation ? `<span class="persian-pronunciation">تلفظ کمکی: ${escapeHtml(word.persianPronunciation)}</span>` : ""}
              </div>
              <div class="meta-row">
                ${word.priority ? `<span class="meta-badge priority">سطح ${escapeHtml(word.priority)}</span>` : ""}
                ${word.partOfSpeech ? `<span class="meta-badge ltr">${escapeHtml(word.partOfSpeech)}</span>` : ""}
                ${word.register ? splitContent(word.register, { splitComma: false }).map(item => `<span class="meta-badge ltr">${escapeHtml(item)}</span>`).join("") : ""}
                ${word.origin ? `<span class="meta-badge ltr">${escapeHtml(word.origin)}</span>` : ""}
              </div>
            </div>
            <button id="sound-button" class="icon-button sound-button" type="button" aria-label="پخش تلفظ ${escapeHtml(word.word)}" ${state.speechReady ? "" : "disabled"}>⌁</button>
          </header>

          <div class="poster-body">
            <div class="quick-grid">
              ${renderCard({ number: "1", title: "معنی هسته‌ای", tone: "purple", body: meaningBody })}
              ${renderCard({ number: "2", title: "تعریف و مفهوم", tone: "blue", body: definitionBody })}
            </div>

            <div class="poster-grid">
              ${renderCard({ number: "3", title: "ثبت محتوای مدرس", tone: "yellow", body: teacherBody })}
              ${renderCard({ number: "4", title: "ساخت واژه و الگوی دستوری", tone: "blue", body: structureBody })}
              ${renderCard({ number: "5", title: "واژه در متن", tone: "green", body: examples })}
              ${renderCard({ number: "6", title: "کاربرد تخصصی", tone: "teal", body: clinicalBody })}
              ${renderCard({ number: "7", title: "شبکه معنایی و تمایز", tone: "orange", body: networkBody, full: true })}
              ${renderCard({ number: "8", title: "بازیابی فعال", tone: "purple", body: recallBody, full: true })}
              ${renderCard({ number: "9", title: "تست سریع", tone: "pink", body: quizBody, full: true })}
              ${renderCard({ number: "10", title: "برنامه مرور", tone: "yellow", body: reviewBody, full: true })}
              ${renderCard({ number: "11", title: "شواهد و منابع", tone: "teal", body: evidenceBody, full: true })}
            </div>
          </div>

          <nav class="poster-navigation" aria-label="حرکت میان واژه‌ها">
            <button id="previous-word" class="nav-button" type="button" ${state.currentWordIndex <= 0 ? "disabled" : ""}>واژه قبلی</button>
            <button id="next-word" class="nav-button" type="button" ${state.currentWordIndex >= state.lesson.words.length - 1 ? "disabled" : ""}>واژه بعدی</button>
          </nav>
        </article>
      `;

      document.getElementById("sound-button")?.addEventListener("click", () => speak(word.word));
      document.getElementById("previous-word")?.addEventListener("click", () => selectWord(state.currentWordIndex - 1));
      document.getElementById("next-word")?.addEventListener("click", () => selectWord(state.currentWordIndex + 1));
    }

    function selectWord(index, options = {}) {
      if (!state.lesson || index < 0 || index >= state.lesson.words.length) return;
      state.currentWordIndex = index;
      const word = state.lesson.words[index];
      renderWords();
      refs.emptyState.hidden = true;
      renderArticle(word);
      document.title = `${word.word} | کاتالوگ واژگان دندان‌پزشکی`;

      if (options.updateHash !== false) updateHash();

      requestAnimationFrame(() => {
        const article = document.getElementById("word-poster");
        if (!article) return;
        if (options.scroll !== false) article.scrollIntoView({ behavior: "smooth", block: "start" });
        article.focus({ preventScroll: true });
      });
    }

    function speak(word) {
      if (!state.speechReady || !word) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = "en-US";
      utterance.rate = .84;
      const voices = window.speechSynthesis.getVoices();
      const englishVoice = voices.find(voice => voice.lang?.toLowerCase().startsWith("en"));
      if (englishVoice) utterance.voice = englishVoice;
      window.speechSynthesis.speak(utterance);
    }

    function updateHash() {
      const word = state.lesson?.words[state.currentWordIndex];
      const nextHash = word
        ? `#/lesson/${state.currentLesson}/word/${encodeURIComponent(word.id)}`
        : `#/lesson/${state.currentLesson}`;

      if (location.hash !== nextHash) history.replaceState(null, "", nextHash);
    }

    function routeFromHash() {
      const match = location.hash.match(/^#\/lesson\/(\d+)(?:\/word\/([^/]+))?/);
      if (!match) {
        const saved = Number(localStorage.getItem("dentalVocabularyLastLesson"));
        return {
          lesson: Number.isInteger(saved) && saved >= 1 && saved <= CONFIG.lessonCount ? saved : 1,
          wordId: null
        };
      }

      const lesson = Math.min(CONFIG.lessonCount, Math.max(1, Number(match[1]) || 1));
      return { lesson, wordId: match[2] ? decodeURIComponent(match[2]) : null };
    }

    refs.menuButton.addEventListener("click", openDrawer);
    refs.closeButton.addEventListener("click", () => closeDrawer());
    refs.overlay.addEventListener("click", () => closeDrawer());

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && state.drawerOpen) closeDrawer();
      if (!state.drawerOpen && state.lesson) {
        if (event.key === "ArrowLeft" && state.currentWordIndex < state.lesson.words.length - 1) {
          selectWord(state.currentWordIndex + 1);
        }
        if (event.key === "ArrowRight" && state.currentWordIndex > 0) {
          selectWord(state.currentWordIndex - 1);
        }
      }
    });

    window.addEventListener("hashchange", () => {
      const route = routeFromHash();
      if (route.lesson !== state.currentLesson || !state.lesson) {
        loadLesson(route.lesson, -1, { wordId: route.wordId });
      } else if (route.wordId) {
        const index = state.lesson.words.findIndex(word => word.id === route.wordId || word.slug === route.wordId);
        if (index >= 0 && index !== state.currentWordIndex) {
          selectWord(index, { scroll: false, updateHash: false });
        }
      }
    });

    renderLessonMenu();
    const initialRoute = routeFromHash();
    loadLesson(initialRoute.lesson, -1, { wordId: initialRoute.wordId });
  </script>
</body>
</html>
